name: ' Custom Workflow'

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  generate-symbols:
    runs-on: windows-latest

    # Use the existing GitHub Environment (settings -> Environments) so its
    # secrets/variables (e.g. ALGOPROJECTAPPPROD_AUTHCONTEXT) are available here
    environment:
      name: PROD

    env:
      ALGoEnvSettings: ${{ vars.ALGoEnvironmentSettings }}
      ALGoEnvName: 'PROD'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read settings
        uses: microsoft/AL-Go-Actions/ReadSettings@v9.2
        with:
          shell: pwsh

      - name: Read secrets
        id: ReadSecrets
        uses: microsoft/AL-Go-Actions/ReadSecrets@v9.2
        with:
          shell: pwsh
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'PROD-AuthContext,ALGOPROJECTAPPPROD_AUTHCONTEXT,AuthContext'

      - name: Show environment
        id: showEnvironment
        shell: pwsh
        env:
          Secrets: ${{ steps.ReadSecrets.outputs.Secrets }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0

          Write-Host "Running BC Symbol generation"

          # --- Environment name from AL-Go settings (DeployToPROD.EnvironmentName) ---
          $settings = $env:Settings | ConvertFrom-Json
          $environmentName = 'Production'
          if ($settings.PSObject.Properties.Name -contains 'DeployToPROD' -and $settings.DeployToPROD.EnvironmentName) {
            $environmentName = $settings.DeployToPROD.EnvironmentName
          }
          Write-Host "GitHub environment : PROD"
          Write-Host "BC environment     : $environmentName"

          # --- AuthContext from the GitHub Environment secret ---
          $secrets = $env:Secrets | ConvertFrom-Json
          $authContextJson = $null
          foreach($secretName in @('PROD-AuthContext','ALGOPROJECTAPPPROD_AUTHCONTEXT','AuthContext')) {
            if (!$authContextJson -and $secrets.PSObject.Properties.Name -contains $secretName -and $secrets."$secretName") {
              $value = $secrets."$secretName"
              # ReadSecrets returns secret values base64 encoded - fall back to raw value
              try { $value = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($value)) } catch {}
              $authContextJson = $value
              Write-Host "Using secret '$secretName' as AuthContext"
            }
          }
          if (!$authContextJson) {
            throw "No AuthContext secret found for environment PROD. Expected ALGOPROJECTAPPPROD_AUTHCONTEXT (see .github/AL-Go-Settings.json)."
          }

          # --- Get an access token for the BC Admin Center API ---
          $authContext = $authContextJson | ConvertFrom-Json
          function Get-Value([object] $obj, [string[]] $names) {
            foreach($name in $names) {
              if ($obj.PSObject.Properties.Name -contains $name -and $obj."$name") { return $obj."$name" }
            }
            return $null
          }
          $tenantId     = Get-Value $authContext @('TenantId','tenantID','tenant')
          $clientId     = Get-Value $authContext @('ClientId','clientID')
          $clientSecret = Get-Value $authContext @('ClientSecret')
          $refreshToken = Get-Value $authContext @('RefreshToken')
          if (!$tenantId -or !$clientId) {
            throw "AuthContext secret must contain TenantId and ClientId."
          }

          $scope = 'https://api.businesscentral.dynamics.com/.default'
          if ($clientSecret) {
            Write-Host "Authenticating with client credentials (tenant $tenantId)"
            $body = @{ grant_type = 'client_credentials'; client_id = $clientId; client_secret = $clientSecret; scope = $scope }
          }
          elseif ($refreshToken) {
            Write-Host "Authenticating with refresh token (tenant $tenantId)"
            $body = @{ grant_type = 'refresh_token'; client_id = $clientId; refresh_token = $refreshToken; scope = "$scope offline_access" }
          }
          else {
            throw "AuthContext secret must contain either ClientSecret or RefreshToken."
          }
          $token = (Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$tenantId/oauth2/v2.0/token" -Body $body -ContentType 'application/x-www-form-urlencoded').access_token

          # Make the token available to later steps in this job (masked so it can never be logged)
          Write-Host "::add-mask::$token"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_ENV -Value "bcAccessToken=$token"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_ENV -Value "bcTenantId=$tenantId"

          # --- Current version of the PROD environment ---
          # Preferred: Admin Center API (gives both platform and application version).
          # Requires the Entra app to have the "AdminCenter.ReadWrite.All" application
          # permission AND to be listed on "Authorized Microsoft Entra apps" in the BC
          # admin center. Falls back to the Automation API (Base Application version)
          # when that is not granted.
          $headers = @{ Authorization = "Bearer $token" }
          $environmentType = ''
          $countryCode = ''
          $status = ''
          $applicationVersion = ''
          $platformVersion = ''

          $adminApi = "https://api.businesscentral.dynamics.com/admin/v2.24/applications/BusinessCentral/environments"
          try {
            $bcEnvironments = (Invoke-RestMethod -Method Get -Uri $adminApi -Headers $headers).value
            Write-Host "Environments in tenant: $(($bcEnvironments | ForEach-Object { $_.name }) -join ', ')"
            $bcEnvironment = $bcEnvironments | Where-Object { $_.name -eq $environmentName }
            if (!$bcEnvironment) {
              throw "Environment '$environmentName' not found in the tenant."
            }
            $environmentType = $bcEnvironment.type
            $countryCode = $bcEnvironment.countryCode
            $status = $bcEnvironment.status
            $applicationVersion = $bcEnvironment.applicationVersion
            $platformVersion = $bcEnvironment.platformVersion
            Write-Host "Source              : Admin Center API"
          }
          catch {
            $statusCode = ''
            try { $statusCode = [int]$_.Exception.Response.StatusCode } catch {}
            if ($statusCode -in @(401, 403)) {
              Write-Host "::warning::Admin Center API returned $statusCode. The Entra app is missing the 'AdminCenter.ReadWrite.All' application permission or is not authorized in the BC admin center ('Authorized Microsoft Entra apps'). Falling back to the Automation API."
            }
            else {
              Write-Host "::error::Call to $adminApi failed: $($_.Exception.Message)"
              throw
            }

            # Fallback: Automation API inside the environment (needs Automation.ReadWrite.All
            # + the app registered in the environment with D365 AUTOMATION / EXTEN. MGT. - ADMIN)
            $automationApi = "https://api.businesscentral.dynamics.com/v2.0/$tenantId/$environmentName/api/microsoft/automation/v2.0"
            $companies = (Invoke-RestMethod -Method Get -Uri "$automationApi/companies" -Headers $headers).value
            if (!$companies) {
              throw "No companies returned from $automationApi/companies"
            }
            $companyId = $companies[0].id
            Write-Host "Company             : $($companies[0].name) ($companyId)"

            $extensions = (Invoke-RestMethod -Method Get -Uri "$automationApi/companies($companyId)/extensions" -Headers $headers).value
            foreach($displayName in @('Base Application','System Application')) {
              $extension = $extensions | Where-Object { $_.displayName -eq $displayName } | Select-Object -First 1
              if ($extension) {
                $version = "$($extension.versionMajor).$($extension.versionMinor).$($extension.versionBuild).$($extension.versionRevision)"
                if ($displayName -eq 'Base Application') { $applicationVersion = $version } else { $platformVersion = $version }
                Write-Host "$displayName version: $version"
              }
            }
            if (!$applicationVersion) {
              throw "Could not determine the application version of environment '$environmentName'."
            }
            Write-Host "Source              : Automation API (platform version not available - shows System Application version)"
          }

          Write-Host "Type                : $environmentType"
          Write-Host "Country             : $countryCode"
          Write-Host "Status              : $status"
          Write-Host "Application version : $applicationVersion"
          Write-Host "Platform version    : $platformVersion"

          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "environmentName=$environmentName"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "applicationVersion=$applicationVersion"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "platformVersion=$platformVersion"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "countryCode=$countryCode"

          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "## PROD environment`n`n| Property | Value |`n| --- | --- |`n| Environment | $environmentName |`n| Type | $environmentType |`n| Application version | $applicationVersion |`n| Platform version | $platformVersion |"

      - name: Read dependencies
        id: readDependencies
        shell: pwsh
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0

          $outputFolder = Join-Path $env:GITHUB_WORKSPACE 'custom-output/customArtifacts'
          New-Item -Path $outputFolder -ItemType Directory -Force | Out-Null

          # All app.json files in the repo (skip symbol/package folders)
          $excludedFolders = @('.alpackages', '.snapshots', '.git', 'node_modules', '.output')
          $appJsonFiles = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter 'app.json' -Recurse -File |
            Where-Object {
              $pathParts = $_.FullName.Split([char]'\', [char]'/')
              -not ($pathParts | Where-Object { $excludedFolders -contains $_ })
            })
          if (!$appJsonFiles) {
            throw "No app.json found in the repository."
          }

          $dependencies = @()
          foreach($appJsonFile in $appJsonFiles) {
            $app = Get-Content -Path $appJsonFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
            $appFolder = $appJsonFile.Directory.FullName.Substring($env:GITHUB_WORKSPACE.Length).TrimStart('\','/')
            Write-Host "=== $($app.name) $($app.version) by $($app.publisher) ($appFolder) ==="
            Write-Host "  platform    : $($app.platform)"
            Write-Host "  application : $($app.application)"

            $appDependencies = @()
            if ($app.PSObject.Properties.Name -contains 'dependencies' -and $app.dependencies) {
              $appDependencies = @($app.dependencies)
            }
            if ($appDependencies.Count -eq 0) {
              Write-Host "  dependencies: <none>"
              continue
            }
            Write-Host "  dependencies:"
            foreach($dependency in $appDependencies) {
              # app.json uses "id" (new) or "appId" (older runtime versions)
              $id = ''
              foreach($name in @('id','appId')) {
                if ($dependency.PSObject.Properties.Name -contains $name -and $dependency."$name") { $id = $dependency."$name"; break }
              }
              Write-Host "    - $($dependency.publisher) / $($dependency.name) $($dependency.version) [$id]"
              $dependencies += [PSCustomObject]@{
                app        = $app.name
                id         = $id
                name       = $dependency.name
                publisher  = $dependency.publisher
                version    = $dependency.version
              }
            }
          }

          Write-Host "Total dependencies: $($dependencies.Count)"

          # --- Outputs for later steps ---
          # ConvertTo-Json on an empty/single-item array does not produce a JSON array - force it
          $dependenciesJson = '[]'
          if ($dependencies.Count -gt 0) {
            $dependenciesJson = ConvertTo-Json -InputObject @($dependencies) -Depth 5 -Compress
          }
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "dependencyCount=$($dependencies.Count)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "dependenciesJson=$dependenciesJson"

          # --- Artifact file (picked up by the upload-artifact step) ---
          $dependencyFile = Join-Path $outputFolder 'dependencies.txt'
          Set-Content -Encoding UTF8 -Path $dependencyFile -Value "Dependencies for environment $('${{ steps.showEnvironment.outputs.environmentName }}') (application $('${{ steps.showEnvironment.outputs.applicationVersion }}'))"
          if ($dependencies.Count -eq 0) {
            Add-Content -Encoding UTF8 -Path $dependencyFile -Value "No dependencies declared."
          }
          else {
            foreach($dependency in $dependencies) {
              Add-Content -Encoding UTF8 -Path $dependencyFile -Value "$($dependency.app);$($dependency.publisher);$($dependency.name);$($dependency.version);$($dependency.id)"
            }
          }
          Write-Host "Wrote $dependencyFile"

          # --- Job summary ---
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "`n## Dependencies ($($dependencies.Count))`n"
          if ($dependencies.Count -eq 0) {
            Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "No dependencies declared in app.json."
          }
          else {
            Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "| App | Publisher | Dependency | Version |`n| --- | --- | --- | --- |"
            foreach($dependency in $dependencies) {
              Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "| $($dependency.app) | $($dependency.publisher) | $($dependency.name) | $($dependency.version) |"
            }
          }

      - name: Get latest version
        id: getLatestVersion
        shell: pwsh
        env:
          countryCode: ${{ steps.showEnvironment.outputs.countryCode }}
          currentVersion: ${{ steps.showEnvironment.outputs.applicationVersion }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0

          # --- Localization: PROD environment countryCode -> AL-Go "country" setting -> w1 ---
          $country = $env:countryCode
          $countrySource = 'PROD environment'
          if (!$country) {
            $settings = $env:Settings | ConvertFrom-Json
            if ($settings.PSObject.Properties.Name -contains 'country' -and $settings.country) {
              $country = $settings.country
              $countrySource = 'AL-Go setting "country"'
            }
          }
          if (!$country) {
            $country = 'w1'
            $countrySource = 'default'
          }
          $country = $country.ToLowerInvariant()
          Write-Host "Localization        : $country (from $countrySource)"

          if (-not (Get-Module -ListAvailable -Name BcContainerHelper)) {
            Write-Host "Installing BcContainerHelper"
            Install-Module -Name BcContainerHelper -Scope CurrentUser -Force -Confirm:$false
          }
          Import-Module BcContainerHelper -DisableNameChecking

          # --- Latest available Business Central version for that localization ---
          $artifactUrl = Get-BCArtifactUrl -type Sandbox -country $country -select Latest
          if (!$artifactUrl) {
            Write-Host "::warning::No sandbox artifacts found for localization '$country'. Falling back to w1."
            $country = 'w1'
            $artifactUrl = Get-BCArtifactUrl -type Sandbox -country $country -select Latest
          }
          if (!$artifactUrl) {
            throw "Could not determine the latest Business Central version for localization '$country'."
          }
          # .../sandbox/<version>/<country>
          $segments = ([Uri]$artifactUrl).AbsolutePath.Trim('/').Split('/')
          $latestVersion = $segments[1]
          Write-Host "Latest version      : $latestVersion"
          Write-Host "Artifact url        : $artifactUrl"

          # --- Latest version within the major currently running on PROD ---
          $currentVersion = $env:currentVersion
          $latestVersionSameMajor = ''
          $updateAvailable = $false
          $major = ''
          if ($currentVersion) {
            $major = $currentVersion.Split('.')[0]
            $sameMajorUrl = Get-BCArtifactUrl -type Sandbox -country $country -version $major -select Latest
            if ($sameMajorUrl) {
              $latestVersionSameMajor = ([Uri]$sameMajorUrl).AbsolutePath.Trim('/').Split('/')[1]
            }
            $updateAvailable = ([System.Version]$latestVersion -gt [System.Version]$currentVersion)
            Write-Host "PROD version        : $currentVersion"
            Write-Host "Latest in major $major  : $latestVersionSameMajor"
            Write-Host "Update available    : $updateAvailable"
          }
          else {
            Write-Host "::warning::No PROD application version available - skipping the version comparison."
          }

          # --- Outputs for later steps ---
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "country=$country"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "latestVersion=$latestVersion"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "latestVersionSameMajor=$latestVersionSameMajor"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "artifactUrl=$artifactUrl"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "updateAvailable=$updateAvailable"

          # --- Artifact file (picked up by the upload-artifact step) ---
          $outputFolder = Join-Path $env:GITHUB_WORKSPACE 'custom-output/customArtifacts'
          New-Item -Path $outputFolder -ItemType Directory -Force | Out-Null
          $versionFile = Join-Path $outputFolder 'versions.txt'
          Set-Content -Encoding UTF8 -Path $versionFile -Value "localization=$country"
          Add-Content -Encoding UTF8 -Path $versionFile -Value "prodVersion=$currentVersion"
          Add-Content -Encoding UTF8 -Path $versionFile -Value "latestVersion=$latestVersion"
          Add-Content -Encoding UTF8 -Path $versionFile -Value "latestVersionSameMajor=$latestVersionSameMajor"
          Add-Content -Encoding UTF8 -Path $versionFile -Value "updateAvailable=$updateAvailable"
          Add-Content -Encoding UTF8 -Path $versionFile -Value "artifactUrl=$artifactUrl"
          Write-Host "Wrote $versionFile"

          # --- Job summary ---
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "`n## Latest version ($country)`n"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "| Property | Value |`n| --- | --- |`n| Localization | $country |`n| PROD version | $currentVersion |`n| Latest available | $latestVersion |`n| Latest in major $major | $latestVersionSameMajor |`n| Update available | $updateAvailable |"

      - name: Generate Symbols
        shell: pwsh
        run: |
          # Your CreateSymbolPackage command here
          Write-Host "CreateSymbolPackage for BC ${{ steps.showEnvironment.outputs.applicationVersion }}"

      - name: Download Symbols
        id: downloadSymbols
        shell: pwsh
        env:
          environmentName: ${{ steps.showEnvironment.outputs.environmentName }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0

          $symbolsFolder = Join-Path $env:GITHUB_WORKSPACE 'custom-output/customArtifacts'
          New-Item -Path $symbolsFolder -ItemType Directory -Force | Out-Null

          if (!$env:bcAccessToken) { throw "No access token available - the 'Show environment' step must run first." }
          $headers = @{ Authorization = "Bearer $($env:bcAccessToken)" }
          $devServerUrl = "https://api.businesscentral.dynamics.com/v2.0/$($env:environmentName)"
          $tenant = $env:bcTenantId
          Write-Host "Dev endpoint        : $devServerUrl/dev/packages"

          # --- Build the list of symbols to download (Microsoft apps only) ---
          $symbols = New-Object System.Collections.Generic.List[object]
          $seen = New-Object 'System.Collections.Generic.HashSet[string]'
          function Add-Symbol {
            param([string] $publisher, [string] $name, [string] $version, [string] $appId)
            if (!$name -or !$version) { return }
            if ($publisher -ne 'Microsoft') {
              Write-Host "  skipping $publisher / $name (not published by Microsoft)"
              return
            }
            if (!$seen.Add("$publisher|$name")) { return }
            $symbols.Add([PSCustomObject]@{ publisher = $publisher; name = $name; version = $version; appId = $appId })
          }

          $excludedFolders = @('.alpackages', '.snapshots', '.git', 'node_modules', '.output', 'custom-output')
          $appJsonFiles = @(Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter 'app.json' -Recurse -File |
            Where-Object {
              $pathParts = $_.FullName.Split([char]'\', [char]'/')
              -not ($pathParts | Where-Object { $excludedFolders -contains $_ })
            })

          foreach($appJsonFile in $appJsonFiles) {
            $app = Get-Content -Path $appJsonFile.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
            Write-Host "=== $($app.name) $($app.version) ==="
            # "platform" -> Microsoft/System, "application" -> Microsoft/Application + Base Application
            if ($app.PSObject.Properties.Name -contains 'platform' -and $app.platform) {
              Add-Symbol -publisher 'Microsoft' -name 'System' -version $app.platform -appId '8874ed3a-0643-4247-9ced-7a7002f7135d'
            }
            if ($app.PSObject.Properties.Name -contains 'application' -and $app.application) {
              Add-Symbol -publisher 'Microsoft' -name 'Application' -version $app.application -appId 'c1335042-3002-4257-bf8a-75c898ccb1b8'
              Add-Symbol -publisher 'Microsoft' -name 'Base Application' -version $app.application -appId ''
            }
            # explicit dependencies from app.json
            if ($app.PSObject.Properties.Name -contains 'dependencies' -and $app.dependencies) {
              foreach($dependency in @($app.dependencies)) {
                $appId = ''
                foreach($idName in @('id','appId')) {
                  if ($dependency.PSObject.Properties.Name -contains $idName -and $dependency."$idName") { $appId = $dependency."$idName"; break }
                }
                Add-Symbol -publisher $dependency.publisher -name $dependency.name -version $dependency.version -appId $appId
              }
            }
          }
          Write-Host "Symbols to download : $($symbols.Count)"

          # --- Download each symbol package from the environment ---
          $invalidChars = [System.IO.Path]::GetInvalidFileNameChars()
          $downloaded = @()
          $failed = @()
          foreach($symbol in $symbols) {
            $fileName = ("$($symbol.publisher)_$($symbol.name)_$($symbol.version).app").Split($invalidChars) -join ''
            $targetFile = Join-Path $symbolsFolder $fileName

            if ($symbol.appId) {
              $url = "$devServerUrl/dev/packages?appId=$($symbol.appId)&versionText=$($symbol.version)&tenant=$tenant"
            }
            else {
              $url = "$devServerUrl/dev/packages?publisher=$([uri]::EscapeDataString($symbol.publisher))&appName=$([uri]::EscapeDataString($symbol.name))&versionText=$($symbol.version)&tenant=$tenant"
            }

            Write-Host "Downloading $($symbol.publisher) / $($symbol.name) $($symbol.version)"
            try {
              $response = Invoke-WebRequest -Uri $url -Headers $headers -OutFile $targetFile -PassThru

              # Prefer the file name the endpoint reports - it carries the real installed version
              try {
                if ($response.Headers.ContainsKey('Content-Disposition')) {
                  $disposition = ($response.Headers['Content-Disposition'] -join ';')
                  $match = [regex]::Match($disposition, 'filename[^=]*=\s*"?([^";]+)"?')
                  if ($match.Success) {
                    $realName = $match.Groups[1].Value.Trim().Trim('"')
                    if ($realName -match "^UTF-8''(.+)$") { $realName = $matches[1] }
                    $realName = [System.IO.Path]::GetFileName([uri]::UnescapeDataString($realName))
                    $realName = $realName.Split($invalidChars) -join ''
                    if ($realName -and $realName -ne $fileName) {
                      Move-Item -Path $targetFile -Destination (Join-Path $symbolsFolder $realName) -Force
                      $fileName = $realName
                      $targetFile = Join-Path $symbolsFolder $realName
                    }
                  }
                }
              }
              catch {
                Write-Host "  could not read the file name from the response - keeping $fileName"
              }

              $sizeMb = [Math]::Round((Get-Item $targetFile).Length / 1MB, 2)
              Write-Host "  -> $fileName ($sizeMb MB)"
              $downloaded += [PSCustomObject]@{ name = $symbol.name; file = $fileName; sizeMb = $sizeMb }
            }
            catch {
              if (Test-Path $targetFile) { Remove-Item $targetFile -Force }
              $statusCode = ''
              try { $statusCode = [int]$_.Exception.Response.StatusCode } catch {}
              $reason = "it is probably not installed on $($env:environmentName)"
              if ($statusCode -in @(401, 403)) { $reason = "the Entra app lacks access to the development endpoint of $($env:environmentName)" }
              Write-Host "::warning::Could not download $($symbol.publisher) / $($symbol.name) $($symbol.version) (HTTP $statusCode) - $reason."
              $failed += "$($symbol.publisher) / $($symbol.name) $($symbol.version) (HTTP $statusCode)"
            }
          }

          if ($downloaded.Count -eq 0) {
            throw "No symbols could be downloaded from $($env:environmentName). Check that the Entra app is registered in the environment with the D365 EXTENSION MGT permission set."
          }
          Write-Host "Downloaded $($downloaded.Count) of $($symbols.Count) symbol packages to $symbolsFolder"

          # --- Outputs / summary ---
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "symbolCount=$($downloaded.Count)"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "symbolsFolder=$symbolsFolder"

          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "`n## Symbols downloaded from $($env:environmentName) ($($downloaded.Count))`n"
          Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "| App | File | Size (MB) |`n| --- | --- | --- |"
          foreach($item in $downloaded) {
            Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "| $($item.name) | $($item.file) | $($item.sizeMb) |"
          }
          if ($failed.Count -gt 0) {
            Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "`nNot downloaded:`n"
            foreach($item in $failed) {
              Add-Content -Encoding UTF8 -Path $env:GITHUB_STEP_SUMMARY -Value "- $item"
            }
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-artifacts
          path: custom-output/customArtifacts/
